<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2311/2311931.png">
    <title>Калькулятор цен</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --bg: #0a0e14; --card: #1c2130; --input: #12171f;
            --border: #2a3040; --text: #f0f2f5; --muted: #5a6278;
            --accent: #7c8aff; --accent-glow: rgba(124, 138, 255, 0.15);
            --green: #4ade80; --green-glow: rgba(74, 222, 128, 0.12);
            --red: #f87171; --radius: 16px;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px 16px; }
        .app-container { max-width: 480px; margin: 0 auto; }
        
        /* Selector */
        .mode-selector { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 16px; overflow: hidden; }
        .mode-header { padding: 16px 20px; display: flex; justify-content: space-between; cursor: pointer; font-weight: 600; }
        .mode-options { max-height: 0; transition: 0.3s ease; overflow: hidden; }
        .open .mode-options { max-height: 200px; }
        .mode-option { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 15px; }
        .mode-option.active { color: var(--accent); }

        /* Card */
        .product-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; transition: 0.3s ease; }
        .product-card.best-deal { border-color: var(--green); background: linear-gradient(135deg, var(--card), rgba(74, 222, 128, 0.05)); }
        .card-head { display: flex; justify-content: space-between; margin-bottom: 12px; color: #8b93a6; font-size: 13px; font-weight: 600; text-transform: uppercase; }
        
        /* Inputs */
        .input-row { display: flex; gap: 10px; }
        .input-group { flex: 1; position: relative; }
        .input-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
        .input-group input { 
            width: 100%; padding: 14px 12px; background: var(--input); border: 1px solid var(--border); 
            border-radius: 12px; color: #fff; font-size: 18px; font-weight: 600; outline: none; transition: 0.2s; 
        }
        .input-group input:focus { border-color: var(--accent); background: #161c26; box-shadow: 0 0 0 4px var(--accent-glow); }
        .input-suffix { position: absolute; right: 12px; bottom: 15px; color: var(--muted); font-size: 13px; pointer-events: none; }

        /* Results */
        .res-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
        .price-val { font-size: 22px; font-weight: 700; }
        .best-badge { background: var(--green-glow); color: var(--green); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .worse-badge { color: var(--red); font-size: 12px; font-weight: 500; }

        .add-btn { width: 100%; padding: 16px; background: none; border: 1px dashed var(--border); border-radius: var(--radius); color: var(--accent); font-weight: 600; margin-bottom: 24px; }
        .summary { background: var(--card); border-radius: var(--radius); padding: 18px; border: 1px solid var(--border); display: none; }
        .visible { display: block; animation: fadeIn 0.3s; }
        .verdict { background: var(--green-glow); padding: 14px; border-radius: 12px; color: var(--green); font-weight: 600; margin-bottom: 12px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .delete-btn { color: var(--red); background: rgba(248, 113, 113, 0.1); border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; }
        input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="mode-selector" id="modeSelector">
            <div class="mode-header" onclick="this.parentElement.classList.toggle('open')">
                <span>Сравнить <span id="modeLabel" style="color:var(--accent)">за единицу</span></span>
                <span style="opacity: 0.5;">▼</span>
            </div>
            <div class="mode-options">
                <div class="mode-option" onclick="setMode('kg')">за килограмм <span>кг</span></div>
                <div class="mode-option" onclick="setMode('liter')">за литр <span>л</span></div>
                <div class="mode-option" onclick="setMode('unit')">за единицу <span>шт</span></div>
            </div>
        </div>

        <div id="productsContainer"></div>
        <button class="add-btn" onclick="addProduct()">+ Добавить товар</button>

        <div class="summary" id="summaryCard">
            <div id="verdictText" class="verdict"></div>
        </div>
    </div>

    <script>
        // --- PWA КОНФИГУРАЦИЯ (КАК В ПРИМЕРЕ) ---
        const manifest = {
            "name": "Калькулятор цен",
            "short_name": "Цены",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0a0e14",
            "theme_color": "#0a0e14",
            "icons": [{ "src": "https://cdn-icons-png.flaticon.com/512/2311/2311931.png", "sizes": "512x512", "type": "image/png" }]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);

        // --- ЛОГИКА ПРИЛОЖЕНИЯ ---
        let mode = 'unit';
        let products = [{ id: 1, p: '', q: '' }, { id: 2, p: '', q: '' }];
        const conf = {
            kg: { label: 'за килограмм', s: 'г', res: '₽/кг', mult: 1000 },
            liter: { label: 'за литр', s: 'мл', res: '₽/л', mult: 1000 },
            unit: { label: 'за единицу', s: 'шт', res: '₽/шт', mult: 1 }
        };

        const haptic = (ms) => { if (navigator.vibrate) navigator.vibrate(ms); };

        function setMode(m) {
            mode = m; haptic(15);
            document.getElementById('modeLabel').textContent = conf[m].label;
            document.getElementById('modeSelector').classList.remove('open');
            render();
        }

        function addProduct() {
            haptic(20);
            products.push({ id: Date.now(), p: '', q: '' });
            render();
        }

        function removeProduct(id) {
            haptic([10, 30, 10]);
            products = products.filter(p => p.id !== id);
            render();
        }

        function update(id, f, v) {
            const item = products.find(p => p.id === id);
            if (item) { item[f] = v; calculate(); }
        }

        function calculate() {
            const vals = products.map(p => {
                const res = (parseFloat(p.p) / parseFloat(p.q)) * conf[mode].mult;
                return isNaN(res) || res === Infinity || res <= 0 ? 0 : res;
            });
            const valid = vals.filter(v => v > 0);
            const min = valid.length ? Math.min(...valid) : Infinity;

            products.forEach((p, i) => {
                const card = document.querySelector(`[data-id="${p.id}"]`);
                const cur = vals[i];
                card.classList.remove('best-deal');
                const badge = card.querySelector('.badge-box');
                badge.innerHTML = '';
                
                if (cur > 0) {
                    card.querySelector('.price-val').textContent = cur < 10 ? cur.toFixed(2) : Math.round(cur);
                    if (cur === min && valid.length > 1) {
                        card.classList.add('best-deal');
                        badge.innerHTML = '<span class="best-badge">Выгодно</span>';
                    } else if (cur > min && min !== Infinity) {
                        badge.innerHTML = `<span class="worse-badge">+${Math.round((cur-min)/min*100)}%</span>`;
                    }
                } else { card.querySelector('.price-val').textContent = '—'; }
            });

            const sum = document.getElementById('summaryCard');
            if (valid.length > 1) {
                sum.classList.add('visible');
                document.getElementById('verdictText').textContent = `Товар ${vals.indexOf(min) + 1} самый выгодный`;
            } else sum.classList.remove('visible');
        }

        function render() {
            document.getElementById('productsContainer').innerHTML = products.map((p, i) => `
                <div class="product-card" data-id="${p.id}">
                    <div class="card-head"><span>Товар ${i + 1}</span>
                        ${products.length > 2 ? `<button class="delete-btn" onclick="removeProduct(${p.id})">×</button>` : ''}
                    </div>
                    <div class="input-row">
                        <div class="input-group"><label>ЦЕНА</label><input type="number" value="${p.p}" oninput="update(${p.id},'p',this.value)" placeholder="0" inputmode="decimal"><span class="input-suffix">₽</span></div>
                        <div class="input-group"><label>${conf[mode].label.split(' ')[1].toUpperCase()}</label><input type="number" value="${p.q}" oninput="update(${p.id},'q',this.value)" placeholder="0" inputmode="decimal"><span class="input-suffix">${conf[mode].s}</span></div>
                    </div>
                    <div class="res-row"><div><span class="price-val">—</span> <small style="color:var(--muted)">${conf[mode].res}</small></div><div class="badge-box"></div></div>
                </div>`).join('');
            calculate();
        }

        render();
    </script>
</body>
</html>
