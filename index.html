<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение цен — Калькулятор выгодной покупки</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #151a24;
            --bg-card: #1c2130;
            --bg-input: #12171f;
            --border-color: #2a3040;
            --border-active: #3a4560;
            --text-primary: #f0f2f5;
            --text-secondary: #8b93a6;
            --text-muted: #5a6278;
            --accent: #7c8aff;
            --accent-glow: rgba(124, 138, 255, 0.15);
            --green: #4ade80;
            --green-glow: rgba(74, 222, 128, 0.12);
            --red: #f87171;
            --radius: 16px;
            --radius-sm: 12px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 16px;
            padding-bottom: 60px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
            font-weight: 400;
        }

        /* Mode Selector */
        .mode-selector {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .mode-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .mode-header:hover {
            background: rgba(255,255,255,0.02);
        }

        .mode-title {
            font-size: 17px;
            font-weight: 600;
        }

        .mode-title span {
            color: var(--accent);
        }

        .mode-chevron {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
            opacity: 0.5;
        }

        .mode-selector.open .mode-chevron {
            transform: rotate(180deg);
        }

        .mode-options {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
        }

        .mode-selector.open .mode-options {
            max-height: 200px;
        }

        .mode-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            cursor: pointer;
            transition: background 0.2s;
            border-top: 1px solid var(--border-color);
        }

        .mode-option:hover {
            background: rgba(255,255,255,0.02);
        }

        .mode-option-label {
            font-size: 16px;
            font-weight: 500;
        }

        .radio-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .mode-option.active .radio-circle {
            border-color: var(--accent);
            background: var(--accent);
        }

        .mode-option.active .radio-circle::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: white;
        }

        /* Products Container */
        .products-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        /* Product Card */
        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-10px) scale(0.95); }
        }

        .product-card.removing {
            animation: slideOut 0.25s ease forwards;
        }

        .product-card.best-deal {
            border-color: var(--green);
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(74, 222, 128, 0.04) 100%);
        }

        .product-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px 10px;
        }

        .product-label {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .product-card.best-deal .product-label {
            color: var(--green);
        }

        .delete-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: rgba(248, 113, 113, 0.1);
            color: var(--red);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            opacity: 0.6;
        }

        .delete-btn:hover {
            opacity: 1;
            background: rgba(248, 113, 113, 0.2);
        }

        .product-inputs {
            padding: 0 18px 14px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-group {
            flex: 1;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-group input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 16px;
        }

        .input-suffix {
            position: absolute;
            right: 14px;
            bottom: 14px;
            font-size: 14px;
            color: var(--text-muted);
            pointer-events: none;
            font-weight: 500;
        }

        /* Price Result */
        .price-result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px 14px;
        }

        .price-result-left {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .price-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .price-unit {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .best-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--green-glow);
            color: var(--green);
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            animation: badgePop 0.3s ease;
        }

        @keyframes badgePop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .worse-badge {
            font-size: 13px;
            color: var(--red);
            font-weight: 500;
        }

        /* Add Button */
        .add-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius);
            color: var(--accent);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            margin-bottom: 16px;
        }

        .add-btn:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .add-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Summary Card */
        .summary-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 18px;
            margin-bottom: 16px;
            display: none;
        }

        .summary-card.visible {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .summary-title {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .summary-verdict {
            background: var(--green-glow);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 14px;
        }

        .verdict-main {
            font-size: 15px;
            font-weight: 600;
            color: var(--green);
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .verdict-details {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .verdict-detail {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .verdict-detail strong {
            color: var(--green);
            font-weight: 600;
        }

        .summary-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-product-name {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .summary-product-name.best {
            color: var(--green);
            font-weight: 600;
        }

        .summary-product-price {
            font-size: 14px;
            font-weight: 600;
        }

        .summary-product-price.best {
            color: var(--green);
        }

        .summary-saving {
            font-size: 13px;
            color: var(--red);
            font-weight: 500;
            margin-left: 6px;
        }

        .summary-bar {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
        }

        .summary-bar-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .bar-container {
            height: 6px;
            background: var(--bg-input);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
            background: var(--accent);
        }

        .bar-fill.best {
            background: var(--green);
        }

        .bar-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

        ::-webkit-scrollbar { width: 0; }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }

        @media (max-width: 400px) {
            .input-group input { font-size: 16px; padding: 12px 14px; }
            .price-value { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <p class="subtitle">Сравните ценники и узнайте, какой из товаров дешевле.</p>

        <!-- Mode Selector -->
        <div class="mode-selector" id="modeSelector">
            <div class="mode-header" id="modeHeader" onclick="toggleModeDropdown()">
                <div class="mode-header-left">
                    <div class="mode-title">Сравнить цену <span id="modeDisplayText">за единицу</span></div>
                </div>
                <svg class="mode-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </div>
            <div class="mode-options">
                <div class="mode-option" data-mode="kg" onclick="setMode('kg')">
                    <span class="mode-option-label">за килограмм</span>
                    <div class="radio-circle"></div>
                </div>
                <div class="mode-option" data-mode="liter" onclick="setMode('liter')">
                    <span class="mode-option-label">за литр</span>
                    <div class="radio-circle"></div>
                </div>
                <div class="mode-option active" data-mode="unit" onclick="setMode('unit')">
                    <span class="mode-option-label">за единицу</span>
                    <div class="radio-circle"></div>
                </div>
            </div>
        </div>

        <!-- Products -->
        <div class="products-container" id="productsContainer"></div>

        <!-- Add Button -->
        <button class="add-btn" id="addBtn" onclick="addProduct()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Добавить ещё товар
        </button>

        <!-- Summary -->
        <div class="summary-card" id="summaryCard">
            <div class="summary-title">Итог сравнения</div>
            <div id="summaryVerdict"></div>
            <div id="summaryContent"></div>
            <div class="summary-bar" id="summaryBar"></div>
        </div>
    </div>

    <script>
        let currentMode = 'unit';
        let products = [];
        let nextId = 1;

        const modeConfig = {
            kg: {
                label: 'за килограмм',
                inputLabel: 'грамм',
                inputSuffix: 'г',
                resultSuffix: '₽/кг',
                priceDisplay: 'кг',
                exampleQty: '120'
            },
            liter: {
                label: 'за литр',
                inputLabel: 'миллилитров',
                inputSuffix: 'мл',
                resultSuffix: '₽/л',
                priceDisplay: 'л',
                exampleQty: '120'
            },
            unit: {
                label: 'за единицу',
                inputLabel: 'штук',
                inputSuffix: 'шт',
                resultSuffix: '₽/шт',
                priceDisplay: 'шт',
                exampleQty: '10'
            }
        };

        function init() {
            products = [
                { id: nextId++, price: '', quantity: '', label: 'Товар 1' },
                { id: nextId++, price: '', quantity: '', label: 'Товар 2' }
            ];
            render();
        }

        function toggleModeDropdown() {
            document.getElementById('modeSelector').classList.toggle('open');
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.mode === mode);
            });
            document.getElementById('modeDisplayText').textContent = modeConfig[mode].label;
            document.getElementById('modeSelector').classList.remove('open');
            render();
        }

        function addProduct() {
            const count = products.length + 1;
            products.push({
                id: nextId++,
                price: '',
                quantity: '',
                label: `Товар ${count}`
            });
            render();
        }

        function removeProduct(id) {
            const card = document.querySelector(`[data-product-id="${id}"]`);
            if (card) {
                card.classList.add('removing');
                setTimeout(() => {
                    products = products.filter(p => p.id !== id);
                    products.forEach((p, i) => {
                        p.label = `Товар ${i + 1}`;
                    });
                    render();
                }, 250);
            }
        }

        function updateProduct(id, field, value) {
            const product = products.find(p => p.id === id);
            if (product) {
                product[field] = value;
                calculate();
            }
        }

        function calculatePricePerUnit(price, quantity) {
            const p = parseFloat(price);
            const q = parseFloat(quantity);
            if (!p || !q || isNaN(p) || isNaN(q)) return 0;
            if (currentMode === 'kg' || currentMode === 'liter') {
                return (p / q) * 1000;
            }
            return p / q;
        }

        function formatPrice(price) {
            if (price === 0) return '0';
            if (price < 1) return price.toFixed(2);
            if (price < 10) return price.toFixed(2);
            return Math.round(price).toString();
        }

        function formatRubles(value) {
            if (value < 1) return value.toFixed(2);
            if (value < 10) return value.toFixed(1);
            return Math.round(value).toString();
        }

        function calculate() {
            const config = modeConfig[currentMode];
            let results = [];
            let validProducts = [];

            products.forEach(p => {
                const pricePerUnit = calculatePricePerUnit(p.price, p.quantity);
                results.push({
                    id: p.id,
                    label: p.label,
                    price: p.price,
                    quantity: p.quantity,
                    pricePerUnit: pricePerUnit,
                    hasData: !!(p.price && p.quantity && parseFloat(p.price) > 0 && parseFloat(p.quantity) > 0)
                });
                if (pricePerUnit > 0) {
                    validProducts.push(pricePerUnit);
                }
            });

            let minPrice = Infinity;
            results.forEach(r => {
                if (r.pricePerUnit > 0 && r.pricePerUnit < minPrice) {
                    minPrice = r.pricePerUnit;
                }
            });

            results.forEach(r => {
                const priceEl = document.querySelector(`[data-product-id="${r.id}"] .price-value`);
                const unitEl = document.querySelector(`[data-product-id="${r.id}"] .price-unit`);
                const badgeEl = document.querySelector(`[data-product-id="${r.id}"] .badges-container`);
                const cardEl = document.querySelector(`[data-product-id="${r.id}"]`);

                if (r.hasData) {
                    priceEl.textContent = formatPrice(r.pricePerUnit);
                    unitEl.textContent = config.resultSuffix;
                } else {
                    priceEl.textContent = '—';
                    unitEl.textContent = '';
                }

                if (cardEl) cardEl.classList.remove('best-deal');
                if (badgeEl) badgeEl.innerHTML = '';

                if (r.hasData && r.pricePerUnit === minPrice && validProducts.length > 1) {
                    if (cardEl) cardEl.classList.add('best-deal');
                    if (badgeEl) badgeEl.innerHTML = `<span class="best-badge">✓ Дешевле!</span>`;
                } else if (r.hasData && minPrice < Infinity && r.pricePerUnit > minPrice && validProducts.length > 1) {
                    const diff = r.pricePerUnit - minPrice;
                    const diffPercent = Math.round((diff / minPrice) * 100);
                    if (badgeEl) badgeEl.innerHTML = `<span class="worse-badge">дороже на ${diffPercent}%</span>`;
                }
            });

            updateSummary(results, minPrice, validProducts);
        }

        function updateSummary(results, minPrice, validProducts) {
            const summaryCard = document.getElementById('summaryCard');
            const summaryVerdict = document.getElementById('summaryVerdict');
            const summaryContent = document.getElementById('summaryContent');
            const summaryBar = document.getElementById('summaryBar');

            const validResults = results.filter(r => r.hasData);

            if (validResults.length < 2) {
                summaryCard.classList.remove('visible');
                return;
            }

            summaryCard.classList.add('visible');

            const sorted = [...validResults].sort((a, b) => a.pricePerUnit - b.pricePerUnit);
            const best = sorted[0];
            const worst = sorted[sorted.length - 1];
            const diff = worst.pricePerUnit - best.pricePerUnit;
            const diffPercent = Math.round((diff / best.pricePerUnit) * 100);
            const config = modeConfig[currentMode];

            // Verdict block
            summaryVerdict.innerHTML = `
                <div class="summary-verdict">
                    <div class="verdict-main">
                        ${best.label} дешевле ${worst.label}
                    </div>
                    <div class="verdict-details">
                        <span class="verdict-detail">на <strong>${diffPercent}%</strong></span>
                        <span class="verdict-detail">·</span>
                        <span class="verdict-detail">на <strong>${formatRubles(diff)} ₽/${config.priceDisplay}</strong></span>
                    </div>
                </div>
            `;

            // Table
            let html = '';
            sorted.forEach((r, i) => {
                const isBest = r.pricePerUnit === minPrice;
                const saving = i === 0 ? null : Math.round((r.pricePerUnit - minPrice) / minPrice * 100);
                html += `
                    <div class="summary-row">
                        <span class="summary-product-name ${isBest ? 'best' : ''}">${r.label}</span>
                        <div>
                            <span class="summary-product-price ${isBest ? 'best' : ''}">${formatPrice(r.pricePerUnit)} ₽/${config.priceDisplay}</span>
                            ${!isBest ? `<span class="summary-saving">+${saving}%</span>` : ''}
                        </div>
                    </div>
                `;
            });
            summaryContent.innerHTML = html;

            // Bar chart
            const maxPrice = sorted[sorted.length - 1].pricePerUnit;
            let barHtml = '<div class="summary-bar-label">Сравнение цен:</div>';
            sorted.forEach(r => {
                const width = Math.max(5, (r.pricePerUnit / maxPrice) * 100);
                const isBest = r.pricePerUnit === minPrice;
                barHtml += `
                    <div style="margin-bottom:6px;">
                        <div class="bar-container">
                            <div class="bar-fill ${isBest ? 'best' : ''}" style="width:${width}%"></div>
                        </div>
                        <div class="bar-labels">
                            <span>${r.label}</span>
                            <span>${formatPrice(r.pricePerUnit)} ₽/${config.priceDisplay}</span>
                        </div>
                    </div>
                `;
            });
            summaryBar.innerHTML = barHtml;
        }

        function render() {
            const container = document.getElementById('productsContainer');
            const config = modeConfig[currentMode];

            container.innerHTML = products.map((product) => {
                const pricePerUnit = calculatePricePerUnit(product.price, product.quantity);
                const hasData = !!(product.price && product.quantity && parseFloat(product.price) > 0 && parseFloat(product.quantity) > 0);

                return `
                    <div class="product-card" data-product-id="${product.id}">
                        <div class="product-card-header">
                            <span class="product-label">${product.label}</span>
                            ${products.length > 2 ? `<button class="delete-btn" onclick="removeProduct(${product.id})" title="Удалить">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                                </svg>
                            </button>` : '<div style="width:28px"></div>'}
                        </div>
                        <div class="product-inputs">
                            <div class="input-row">
                                <div class="input-group">
                                    <label>Цена</label>
                                    <input type="number" placeholder="0" value="${product.price}" 
                                        oninput="updateProduct(${product.id}, 'price', this.value)"
                                        onfocus="this.select()">
                                    <span class="input-suffix">₽</span>
                                </div>
                                <div class="input-group">
                                    <label>${config.inputLabel}</label>
                                    <input type="number" placeholder="${config.exampleQty}" value="${product.quantity}"
                                        oninput="updateProduct(${product.id}, 'quantity', this.value)"
                                        onfocus="this.select()">
                                    <span class="input-suffix">${config.inputSuffix}</span>
                                </div>
                            </div>
                        </div>
                        <div class="price-result">
                            <div class="price-result-left">
                                <span class="price-value">${hasData ? formatPrice(pricePerUnit) : '—'}</span>
                                <span class="price-unit">${hasData ? config.resultSuffix : ''}</span>
                            </div>
                            <span class="badges-container"></span>
                        </div>
                    </div>
                `;
            }).join('');

            calculate();
        }

        document.addEventListener('click', (e) => {
            const selector = document.getElementById('modeSelector');
            if (!selector.contains(e.target)) {
                selector.classList.remove('open');
            }
        });

        init();
    </script>
</body>
</html>
